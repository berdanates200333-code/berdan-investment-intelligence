name: Risikolabor (Auswertung, manuell)

# Reine Rechenauswertung ohne Handel und ohne Eingriff in laufende Konten. Manuell startbar.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: risikolabor
  cancel-in-progress: false

jobs:
  labor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python scripts/fc_risikolabor.py
      - name: Speichern
        run: |
          git config user.name "market-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/risikolabor
          git diff --cached --quiet && exit 0
          git commit -q -m "Risikolabor $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
