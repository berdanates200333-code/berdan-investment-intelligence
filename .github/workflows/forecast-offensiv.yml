name: Performance-Konto (offensiv, virtuell)

# Getrennt vom Hauptkonto. 12:45 UTC: Orders einreichen (vor der Eröffnung). 23:15 UTC: Tageszyklus (nach dem Nachtlauf des Hauptkontos).
# Fehler hier berühren das Hauptkonto nicht. Nur virtuell, kein Echtgeld.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "orders | cycle"
        default: "cycle"
        type: string
  schedule:
    - cron: "45 12 * * 1-5"
    - cron: "15 23 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-check
  cancel-in-progress: false

jobs:
  offensiv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests
      - name: Modus bestimmen
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "modus=${{ inputs.modus }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "45 12 * * 1-5" ]; then echo "modus=orders" >> "$GITHUB_OUTPUT";
          else echo "modus=cycle" >> "$GITHUB_OUTPUT"; fi
      - name: Ausführen
        id: r
        run: |
          set +e
          python scripts/fc_offensiv.py "${{ steps.m.outputs.modus }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Speichern
        run: |
          git config user.name "market-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast
          if [ -d reports/forecast ]; then git add reports/forecast; fi
          git diff --cached --quiet && exit 0
          git commit -q -m "Offensivkonto ${{ steps.m.outputs.modus }} $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Fehler melden
        if: steps.r.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "FEHLER Offensivkonto ${{ steps.m.outputs.modus }} $(date -u +%d.%m.%Y)" --body "Siehe forecast/offensiv_*_status.json. Das Hauptkonto ist nicht betroffen. Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
