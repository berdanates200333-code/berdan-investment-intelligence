name: Prognose-Erfolgskontrolle, Universum, Probelauf (virtuell)

# Täglich Mo–Fr 08:00 UTC: Die Zweitquelle (Nasdaq) liefert den Tagesbalken erst am Morgen (abends nur Stufe B, belegt am 03./04.11.2026). Datenstufen prüfen, Universum zulassen,
# fällige Prognosen bewerten (nur qualitätsgeprüfte Daten), Systemprobelauf der KI-Konten, Startschranke prüfen.
# Keine Echtgeldorders, keine Broker-Verbindung, keine Zugangsdaten, keine Kosten.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-check
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Universum prüfen (Datenstufe A + Liquidität)
        id: uni
        run: |
          set +e
          python scripts/fc_universe.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Benchmark festschreiben (einmalig, Datenstufe A)
        id: bm
        run: |
          set +e
          python scripts/fc_benchmark.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Systemprobelauf der KI-Konten (gemeinsame Engine)
        id: pro
        run: |
          set +e
          python scripts/fc_probelauf.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Wettbewerbszyklus der echten KI-Konten (nur nach offiziellem Start)
        id: wb
        run: |
          set +e
          python scripts/fc_wettbewerb.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Erfolgskontrolle fälliger Prognosen
        id: ev
        run: |
          set +e
          python scripts/fc_evaluate.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Startschranke
        run: python scripts/fc_gate.py
      - name: Speichern
        run: |
          git config user.name "market-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast
          git diff --cached --quiet && exit 0
          git commit -q -m "Prognosesystem: Datenprüfung, Probelauf, Erfolgskontrolle $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Datenfehler melden
        if: steps.ev.outputs.code != '0' || steps.pro.outputs.code != '0' || steps.wb.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "DATENFEHLER Prognosesystem $(date -u +%d.%m.%Y)" \
            --body "Erfolgskontrolle=${{ steps.ev.outputs.code }}, Probelauf=${{ steps.pro.outputs.code }}, Wettbewerb=${{ steps.wb.outputs.code }}, Benchmark=${{ steps.bm.outputs.code }}, Universum=${{ steps.uni.outputs.code }}. Details: forecast/ops_status.json, forecast/universum_status.json. Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
