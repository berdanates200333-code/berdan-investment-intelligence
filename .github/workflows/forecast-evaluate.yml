name: Prognose-Erfolgskontrolle (virtuell)

# Täglich Mo–Fr 23:00 UTC (nach US-Börsenschluss): bewertet fällige Prognosen beider KIs mit Kursdaten,
# speichert Bewertungen append-only im Repo. Keine Echtgeldorders, keine Zugangsdaten, keine Kosten.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: market-check
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Tests (Journal-Unveränderlichkeit)
        run: python -m pytest -q tests/test_forecast.py tests/test_journal_pins.py
      - name: Erfolgskontrolle
        id: ev
        run: |
          set +e
          python scripts/fc_evaluate.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Speichern
        run: |
          git config user.name "market-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast reports/forecast
          git diff --cached --quiet && exit 0
          git commit -q -m "Prognose-Erfolgskontrolle $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Datenfehler melden
        if: steps.ev.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "DATENFEHLER Prognose-Erfolgskontrolle $(date -u +%d.%m.%Y)" \
            --body "Kursdaten für mindestens ein Instrument fehlen. Details: forecast/ops_status.json. Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
