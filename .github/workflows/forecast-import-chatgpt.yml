name: ChatGPT-Prognosen ins Journal übernehmen (manuell)

# Der Nutzer fügt die von ChatGPT erzeugte JSON-Prognoseliste ein. Der Eingangszeitpunkt (Git-Commit) ist der
# belegbare Zeitstempel; Prognosen nach Beginn des Bewertungszeitraums werden abgelehnt. Claude liest diese Datei nicht.
on:
  workflow_dispatch:
    inputs:
      prognosen_json:
        description: "JSON-Liste der ChatGPT-Prognosen (Schema: docs/forecast/PROGNOSESYSTEM.md)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: market-check
  cancel-in-progress: false

jobs:
  importieren:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Aufnehmen
        env:
          PROGNOSEN_JSON: ${{ inputs.prognosen_json }}
        run: |
          printf '%s' "$PROGNOSEN_JSON" > "$RUNNER_TEMP/p.json"
          python scripts/fc_add.py chatgpt "$RUNNER_TEMP/p.json" --manuell
      - name: Speichern
        run: |
          git config user.name "market-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/chatgpt
          git commit -q -m "ChatGPT-Prognosen aufgenommen $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 5; done
          exit 1
